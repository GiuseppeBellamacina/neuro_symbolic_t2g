# ============================================================================
# BASELINE — base model, zero-shot, SENZA vincolo simbolico. NESSUN training.
#
# Lower bound NON vincolato: cosa produce Qwen2.5-0.5B senza il componente
# neuro-simbolico. È il riferimento corretto per ablations/decoding/no-grammar
# (il gemello con RL) e il complemento non vincolato di baseline/zero-shot.
#
# ATTENZIONE — TRAPPOLA METRICA. ROUGE-L su questa cella è INGANNEVOLE:
# essendo case-insensitive e split sui non-alfanumerici, premia il modello che
# copia l'inglese in minuscolo (il 62% dei token glossa è il token inglese
# maiuscolizzato). Misurato sul base model: senza Trie ROUGE-L 0.3648 ma
# non_copy_token_accuracy 0.0006. Come spiega il commento in base.yaml, leggere
# questa cella SOLO su exact_match / non_copy_token_accuracy, mai su ROUGE-L.
#
# Uso:
#   CONFIG=experiments/configs/qwen25-05b/baseline/zero-shot-no-grammar.yaml sbatch cluster/eval.sh
# ============================================================================

extends: zero-shot.yaml

grammar:
  enabled: false

evaluation:
  best_of_n: true
  # Dual DISATTIVO di proposito: questa cella è già un punto della griglia
  # esplicita di prompting (baseline/{zero-shot, zero-shot-no-grammar,
  # few-shot}) — il dual la valuterebbe due volte nella stessa modalità.
  # Dichiarato anche se ereditato da zero-shot.yaml: il punto della griglia
  # va leggibile senza risolvere l'extends.
  dual_prompting: false

wandb:
  run_name: "qwen25-05b-baseline-zero-shot-no-grammar"
  tags: ["T2G", "baseline", "zero-shot", "no-grammar", "unconstrained", "eval-only"]