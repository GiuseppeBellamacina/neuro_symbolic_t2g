# ============================================================================
# Replica a seme diverso di sft-grpo/zero-shot (PHOENIX-2014T). Cambia solo
# training.seed, cioe' l'RNG della fase GRPO (init LoRA, rollout, ordine dei
# batch); split e campione di eval restano quelli di dataset.seed.
#
# La fase SFT NON si rifa': adapter_path punta all'adapter SFT della run
# originale, che viene copiato in sft_pretrain/final di questa run. Cosi' la
# replica misura la variabilita' del solo GRPO, cioe' quanto e' solido il
# guadagno di SFT->GRPO sull'SFT (exact match 0,028 contro 0,018).
# ============================================================================

extends: ../sft-grpo/zero-shot.yaml

sft_pretrain:
  adapter_path: "experiments/checkpoints/phoenix-2014t/qwen25-05b/sft-grpo/zero-shot/run_20261004_112601/sft_pretrain/final"

training:
  seed: 1
  output_dir: "experiments/checkpoints/phoenix-2014t/qwen25-05b/seeds/sft-grpo-zero-shot-s1"
  log_dir: "experiments/logs/phoenix-2014t/qwen25-05b/seeds/sft-grpo-zero-shot-s1"

wandb:
  run_name: "phoenix-2014t-qwen25-05b-seeds-sft-grpo-zero-shot-s1"
  tags: ["T2G", "PHOENIX-2014T", "qwen25-05b", "sft-grpo", "zero-shot", "seed-replica"]
