# BASELINE PHOENIX-2014T — base model, zero-shot, SENZA Trie. NESSUN training.
#
# Gemello di aslg-pc12/qwen25-05b/baseline/zero-shot-no-grammar.yaml: misura
# quanto il modello base rispetta il vocabolario chiuso senza alcun supporto.
# E' il punto di partenza per la domanda "il GRPO impara il vincolo senza Trie?"
# (confronto con ablations/decoding/no-grammar*).
#
# Uso:
#   CONFIG=experiments/configs/phoenix-2014t/qwen25-05b/baseline/zero-shot-no-grammar.yaml sbatch cluster/eval.sh
extends: zero-shot.yaml

grammar:
  enabled: false

evaluation:
  best_of_n: true
  dual_prompting: false

wandb:
  run_name: "phoenix-2014t-qwen25-05b-baseline-zero-shot-no-grammar"
  tags: ["T2G", "PHOENIX-2014T", "qwen25-05b", "baseline", "zero-shot", "no-grammar", "unconstrained", "eval-only"]
