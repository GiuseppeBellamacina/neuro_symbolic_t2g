# ============================================================================
# GRPO PHOENIX-2014T — RL dal base model, zero-shot. NESSUN SFT.
#
# Gemello di aslg-pc12/qwen25-05b/grpo/zero-shot.yaml: su ASLG-PC12 è la
# cella con il supporto dei rollout più povero (~1 gruppo su 5 a varianza
# zero), quindi misura QUANDO GRPO non riesce a fare bootstrap. Riferimento:
# baseline/zero-shot.yaml di questo albero.
#
# Uso:
#   CONFIG=experiments/configs/phoenix-2014t/qwen25-05b/grpo/zero-shot.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

training:
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/phoenix-2014t/qwen25-05b/grpo/zero-shot"
  log_dir: "experiments/logs/phoenix-2014t/qwen25-05b/grpo/zero-shot"

wandb:
  run_name: "phoenix-2014t-qwen25-05b-grpo-zero-shot"
  tags: ["T2G", "PHOENIX-2014T", "qwen25-05b", "grpo", "zero-shot", "trie"]
