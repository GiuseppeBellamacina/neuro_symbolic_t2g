# ============================================================================
# SFT valutato SENZA Trie (WOS-46985, 0,5B): SOLO eval, stesso checkpoint di
# sft/zero-shot. Domanda: dopo l'SFT il Trie serve ancora, o il formato e' gia'
# imparato? Confronto diretto: sft/zero-shot (con Trie). Il risultato sta in
# <cella>/run_*/no-trie/ (evaluation.results_subdir) e non tocca quello con Trie.
# ============================================================================

extends: zero-shot.yaml

training:
  eval_only: true  # train.sh rifiuta il config (src/training/__main__.py)

grammar:
  enabled: false

evaluation:
  best_of_n: false
  dual_prompting: false
  results_subdir: "no-trie"

wandb:
  run_name: "wos-46985-qwen25-05b-sft-zero-shot-no-trie"
  tags: ["T2G", "WOS-46985", "qwen25-05b", "sft", "zero-shot", "no-grammar", "eval-only"]
