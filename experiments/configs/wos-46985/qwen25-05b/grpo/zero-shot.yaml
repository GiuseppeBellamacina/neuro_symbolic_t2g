# ============================================================================
# GRPO WOS-46985 — RL dal base model, zero-shot. NESSUN SFT.
#
# Gemello di aslg-pc12/qwen25-05b/grpo/zero-shot.yaml. Riferimento:
# baseline/zero-shot.yaml di questo albero. Su WOS-46985 è anche il
# genitore delle ablazioni (le celle few-shot non esistono, vedi base.yaml).
#
# Uso:
#   CONFIG=experiments/configs/wos-46985/qwen25-05b/grpo/zero-shot.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

training:
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/wos-46985/qwen25-05b/grpo/zero-shot"
  log_dir: "experiments/logs/wos-46985/qwen25-05b/grpo/zero-shot"

wandb:
  run_name: "wos-46985-qwen25-05b-grpo-zero-shot"
  tags: ["T2G-framework", "WoS", "grpo", "zero-shot", "trie"]
