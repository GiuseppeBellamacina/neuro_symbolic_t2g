# ============================================================================
# BASE WOS-46985 — classificazione gerarchica (dominio → area) degli abstract
# di Web of Science, come sequenza vincolata. Uno dei tre dataset di GrammarRL
# (Tuccio et al., arXiv:2609.39869): lì il modello genera il JSON
# {domain, area}; qui il target è LINEARIZZATO in due token di un vocabolario
# chiuso ("CS Machine_learning", vedi src/datasets/wos_dataset.py), così Trie
# dual-root e metriche della pipeline si applicano invariati.
#
# Estende il base di ASLG-PC12: modello, LoRA, GRPO, grammar ed evaluation
# sono gli stessi; cambiano il corpus e i pesi della reward (sotto).
#
# DATI: scaricati da soli in data/wos-46985/Data.csv al primo uso con rete (sul
# cluster da setup.sh) dalla copia Hugging Face jesse-tong/wos46985, verificata
# con sha256 e contro il Data.xlsx originale (Mendeley Data,
# doi:10.17632/9rw3vkcfy4.6). Le etichette sono quelle canoniche del codice
# ufficiale Y (134 classi): vedi src/datasets/wos_dataset.py.
#
# DIFFERENZE DA TENERE A MENTE
# ----------------------------
# * Nessuno split ufficiale (e quello del paper non è pubblico): stessa
#   logica di ASLG-PC12, dedup + 90/10 con seed 42. Numeri non confrontabili
#   uno-a-uno con il paper.
# * Gli abstract sono lunghi: dataset.max_source_words: 256 tronca il testo
#   alle prime 256 parole (dopo lo split), così il prompt zero-shot resta
#   sotto grpo.max_prompt_length (768). Tre abstract di esempio non ci
#   starebbero: niente celle few-shot e dual_prompting disattivato. Cambiare
#   max_source_words NON invalida da solo l'indice del retriever (che qui non
#   si usa) né il vocabolario (le etichette non dipendono dal testo).
# * Il target è di 2 token: exact match = (dominio, area) entrambi corretti;
#   ROUGE-L/BLEU su due token sono poco informativi, leggere exact_match
#   (e gloss_f1_micro: credito per il solo dominio giusto).
# * Il Trie vincola la STRUTTURA (grammar.mode: sequences, sotto): un dominio,
#   poi un'area di quel dominio, poi fine. Le coppie ammesse sono quelle del
#   train (134, tutte le classi del test ci sono già: nessun leak).
# * Con ~42k righe di train, max_steps: 5000 copre ~12% del train in GRPO.
# ============================================================================

extends: ../../aslg-pc12/qwen25-05b/base.yaml

dataset:
  dataset_name: "wos-46985"
  dataset_cache: "data/wos-46985"
  vocab_path: "data/wos-46985/gloss_vocab.txt"
  bigram_matrix_path: "data/wos-46985/bigram_transition.npy"
  prompt_profile: "en-wos"
  max_source_words: 256

# Solo zero-shot su questo dataset (vedi sopra): la passata complementare
# few-shot supererebbe il contesto con tre abstract di esempio.
evaluation:
  dual_prompting: false

retrieval:
  cache_path: "data/wos-46985/retriever_index"

# Uscita = una delle coppie (dominio, area) viste negli split del vocabolario
# (src/grammar/output_grammar.py). Con il Trie a token libero erano generabili
# "Medical Medical", l'area prima del dominio o un'area di un altro dominio.
# Validity e reward di formato usano la stessa grammatica, anche senza Trie.
grammar:
  mode: sequences

wandb:
  run_name: "wos-46985-qwen25-05b"
  tags: ["T2G-framework", "constrained-decoding", "Qwen2.5-0.5B", "WOS-46985", "hierarchical-classification"]

# Reward adattata ai target cortissimi (1-2 token: "NONE", "PER:Mary",
# "CS Machine_learning"). Con i pesi di ASLG, gold_structure vale -1 fisso sotto
# i 2 token in vocabolario e verifier_scaled, che lo moltiplica, pure: una
# risposta corretta di un token prendeva +0,30 invece di +1. Qui la plausibilita'
# dei bigrammi non porta informazione, quindi quei due pesi vanno su gloss_order
# (distanza di edit a token, sensibile alle maiuscole: l'unica componente che
# premia solo l'etichetta esatta). Le etichette sono token lunghi e legittimi,
# quindi il controllo "token sospetto" del format sale da 25 a 64 caratteri.
reward:
  weight_translation: 0.20
  weight_bleu: 0.20
  weight_gold_structure: 0.0
  weight_gloss_order: 0.40
  weight_verifier_scaled: 0.0
  weight_format: 0.10
  weight_repetition: 0.10
  format_max_token_len: 64
