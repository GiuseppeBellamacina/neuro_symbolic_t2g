# ============================================================================
# BASE CoNLL-2003 — named entity recognition come sequenza vincolata. Uno dei
# tre dataset di GrammarRL (Tuccio et al., arXiv:2609.39869): lì il modello
# genera il JSON {person, organization, location, misc} con campi vincolati a
# vocabolari del task; qui il target è LINEARIZZATO in token
# TIPO:Entità ("ORG:EU MISC:German MISC:British", "NONE" senza entità; vedi
# src/datasets/conll_dataset.py), così Trie dual-root e metriche della pipeline
# si applicano invariati.
#
# Estende il base di ASLG-PC12: modello, LoRA, GRPO, grammar ed evaluation
# sono gli stessi; cambiano il corpus e i pesi della reward (sotto).
#
# DATI: scaricati da soli in data/conll-2003/ al primo uso con rete (sul
# cluster da setup.sh), verificati con sha256; vedi src/datasets/conll_dataset.py.
#
# DIFFERENZE DA TENERE A MENTE
# ----------------------------
# * Split UFFICIALI (14.041 / 3.250 / 3.453 frasi), nessun dedup; l'eval
#   sottocampiona 2000 frasi del test come per ASLG-PC12.
# * Il vocabolario chiuso è l'insieme delle entità TIPIZZATE viste nel train:
#   un'entità di test mai vista in train è irraggiungibile col Trie. È il
#   dataset dove ablations/decoding/full-vocab-trie (vocab train+test) pesa di
#   più, e dove leggere quella cella come risultato sarebbe più fuorviante.
# * Metriche da leggere: exact_match (tutte le entità giuste) e gloss F1 a
#   token (gloss_f1_micro), che qui coincide con l'F1 a livello di entità (ogni
#   entità è un token). ROUGE-L/BLEU non vanno letti come risultato: spezzano
#   PER:Mary in per + mary e premiano un'entità sbagliata dello stesso tipo.
#   Nella reward quel credito parziale resta di proposito: guida il GRPO verso
#   il tipo giusto e tiene varia la reward dentro i gruppi.
# * max_completion_length 192 (non 128): il target più lungo del test fa 168
#   token Qwen, cinque superano i 96. A 128 sarebbero troncati.
# * Con 14k frasi di train, max_steps: 5000 copre ~36% del train in GRPO.
# ============================================================================

extends: ../../aslg-pc12/qwen25-05b/base.yaml

dataset:
  dataset_name: "conll-2003"
  dataset_cache: "data/conll-2003"
  vocab_path: "data/conll-2003/gloss_vocab.txt"
  bigram_matrix_path: "data/conll-2003/bigram_transition.npy"
  prompt_profile: "en-conll"

retrieval:
  cache_path: "data/conll-2003/retriever_index"

grpo:
  max_completion_length: 192

# Vincolo per frase (src/grammar/output_grammar.py, mode source_spans): ogni
# token è TIPO:pezzo con TIPO fra i quattro sotto e il pezzo una sequenza
# contigua di parole DELLA FRASE DEL PROMPT (al massimo max_span_words, la
# più lunga entità del train), oppure NONE da solo. Il vocabolario viene
# dall'input, non dal test: nessun leak. Con il Trie sul vocabolario di train
# il 48% delle entità di test era irraggiungibile (tetto di exact match 51%);
# così ogni entità gold è generabile (nel corpus sono tutte pezzi della frase).
# Validity e reward di formato usano la stessa grammatica, anche nelle celle
# senza Trie.
grammar:
  mode: source_spans
  span_types: ["PER", "ORG", "LOC", "MISC"]
  empty_token: "NONE"
  max_span_words: 10

wandb:
  run_name: "conll-2003-qwen25-05b"
  tags: ["T2G-framework", "constrained-decoding", "Qwen2.5-0.5B", "CoNLL-2003", "NER"]

# Reward adattata ai target cortissimi (1-2 token: "NONE", "PER:Mary",
# "CS Machine_learning"). Con i pesi di ASLG, gold_structure vale -1 fisso sotto
# i 2 token in vocabolario e verifier_scaled, che lo moltiplica, pure: una
# risposta corretta di un token prendeva +0,30 invece di +1. Qui la plausibilita'
# dei bigrammi non porta informazione, quindi quei due pesi vanno su gloss_order
# (distanza di edit a token, sensibile alle maiuscole: l'unica componente che
# premia solo l'etichetta esatta). Le etichette sono token lunghi e legittimi,
# quindi il controllo "token sospetto" del format sale da 25 a 64 caratteri.
reward:
  weight_translation: 0.20
  weight_bleu: 0.20
  weight_gold_structure: 0.0
  weight_gloss_order: 0.40
  weight_verifier_scaled: 0.0
  weight_format: 0.10
  weight_repetition: 0.10
  format_max_token_len: 64
