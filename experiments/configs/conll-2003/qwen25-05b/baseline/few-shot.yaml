# ============================================================================
# BASELINE CoNLL-2003 — base model, few-shot (retrieval k=3), Trie attivo.
# NESSUN training.
#
# Gemello di aslg-pc12/qwen25-05b/baseline/few-shot.yaml: isola il
# contributo del PROMPTING, riferimento per grpo/few-shot e sft-grpo/few-shot.
#
# Uso:
#   CONFIG=experiments/configs/conll-2003/qwen25-05b/baseline/few-shot.yaml sbatch cluster/eval.sh
# ============================================================================

extends: ../base.yaml

retrieval:
  enabled: true
  top_k: 3

grpo:
  max_prompt_length: 768

evaluation:
  best_of_n: true
  dual_prompting: false

wandb:
  run_name: "conll-2003-qwen25-05b-baseline-few-shot"
  tags: ["T2G", "CoNLL-2003", "qwen25-05b", "baseline", "few-shot", "retrieval", "trie", "eval-only"]
