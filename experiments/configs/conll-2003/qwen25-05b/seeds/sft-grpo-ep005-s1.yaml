  output_dir: "experiments/checkpoints/conll-2003/qwen25-05b/seeds/sft-grpo-ep005-s1"
  log_dir: "experiments/logs/conll-2003/qwen25-05b/seeds/sft-grpo-ep005-s1"

wandb:
  run_name: "conll-2003-qwen25-05b-seeds-sft-grpo-ep005-s1"
  tags: ["T2G", "CoNLL-2003", "qwen25-05b", "sft-grpo", "zero-shot", "sft-amount", "seed-replica"]
