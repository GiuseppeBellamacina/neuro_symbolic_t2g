# ============================================================================
# GRPO CoNLL-2003 — RL dal base model, few-shot (retrieval k=3). NESSUN SFT.
#
# Gemello di aslg-pc12/qwen25-05b/grpo/few-shot.yaml e genitore delle
# ablazioni di questo albero. Riferimento: baseline/few-shot.yaml.
#
# Uso:
#   CONFIG=experiments/configs/conll-2003/qwen25-05b/grpo/few-shot.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

training:
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/conll-2003/qwen25-05b/grpo/few-shot"
  log_dir: "experiments/logs/conll-2003/qwen25-05b/grpo/few-shot"

retrieval:
  enabled: true
  top_k: 3

wandb:
  run_name: "conll-2003-qwen25-05b-grpo-few-shot"
  tags: ["T2G-framework", "CoNLL-2003", "grpo", "few-shot", "retrieval", "trie"]
