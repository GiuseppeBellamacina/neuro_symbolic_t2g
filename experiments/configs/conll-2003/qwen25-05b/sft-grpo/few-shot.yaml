# ============================================================================
# SFT→GRPO CoNLL-2003 — pipeline completa, few-shot. Phase 0 = SFT, poi GRPO.
#
# Gemello di aslg-pc12/qwen25-05b/sft-grpo/few-shot.yaml. Su ASLG-PC12
# l'RL degrada un SFT già quasi perfetto (reward satura, gruppi a
# varianza zero): questa cella dice se succede anche su un task di
# classificazione/estrazione a vocabolario chiuso.
#
# Riuso dell'adapter SFT ATTIVO: sft_pretrain.training è IDENTICO a
# sft/zero-shot.yaml di questo albero.
#
# Uso:
#   CONFIG=experiments/configs/conll-2003/qwen25-05b/sft-grpo/few-shot.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

# --- Phase 0: SFT pre-training ---
sft_pretrain:
  enabled: true
  reuse_adapter: true
  # Blocco IDENTICO a sft/zero-shot.yaml (stessi 12 campi): vedi
  # aslg-pc12/qwen25-05b/sft-grpo/few-shot.yaml per il perché.
  training:
    num_train_epochs: 3
    per_device_train_batch_size: 4
    per_device_eval_batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-5
    warmup_steps: 50
    weight_decay: 0.1
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    eval_fraction: 0.02
    early_stopping_patience: 3

# --- Phase 1: GRPO ---
training:
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/conll-2003/qwen25-05b/sft-grpo/few-shot"
  log_dir: "experiments/logs/conll-2003/qwen25-05b/sft-grpo/few-shot"

retrieval:
  enabled: true
  top_k: 3

wandb:
  run_name: "conll-2003-qwen25-05b-sft-grpo-few-shot"
  tags: ["T2G-framework", "CoNLL-2003", "sft-grpo", "few-shot", "retrieval", "trie"]
