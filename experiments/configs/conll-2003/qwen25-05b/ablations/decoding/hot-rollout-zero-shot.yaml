# ============================================================================
# CoNLL 0,5B, GRPO dal modello base zero-shot con rollout piu' caldi (T=1,3).
# Un solo fattore rispetto a grpo/zero-shot: grpo.temperature (0,7 -> 1,3).
# Se il limite del GRPO dal base e' l'esplorazione (campiona troppo pochi tipi
# giusti), rollout piu' vari dovrebbero aiutare. Confronto: grpo/zero-shot
# (exact match 0,030, F1 sulle entita' tipate 0,13).
# ============================================================================

extends: ../../grpo/zero-shot.yaml

grpo:
  temperature: 1.3

training:
  output_dir: "experiments/checkpoints/conll-2003/qwen25-05b/ablations/decoding/hot-rollout-zero-shot"
  log_dir: "experiments/logs/conll-2003/qwen25-05b/ablations/decoding/hot-rollout-zero-shot"

wandb:
  run_name: "conll-2003-qwen25-05b-ablations-decoding-hot-rollout-zero-shot"
  tags: ["T2G", "CoNLL-2003", "qwen25-05b", "ablation", "sampler", "hot-rollout", "zero-shot"]
