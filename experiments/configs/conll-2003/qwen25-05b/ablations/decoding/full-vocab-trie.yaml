# ============================================================================
# ABLATION DECODING CoNLL-2003 — Trie costruito sull'INTERO dataset
#
# Rispetto a grpo/few-shot.yaml di questo albero: `dataset.vocab_source:
# all` e `grammar.mode: vocab`, cioè il Trie dual-root storico su un
# vocabolario chiuso di entità tipizzate, costruito su train + dev + test.
# Gemello di aslg-pc12/qwen25-05b/ablations/decoding/full-vocab-trie.yaml
# (vedi lì la spiegazione completa).
#
# DATA LEAK DELIBERATO: mai riportare come risultato.
#
# Su CoNLL-2003 le celle normali usano il Trie per frase (grammar.mode:
# source_spans, nel base), che non dipende dal vocabolario: senza
# `grammar.mode: vocab` questa cella sarebbe identica a grpo/few-shot. Qui
# si confronta il vincolo per frase (nessun leak) con un vocabolario chiuso
# che contiene già le entità di test. Con il vocabolario del solo train il
# 48% delle entità di test sarebbe irraggiungibile.
#
# Uso:
#   CONFIG=experiments/configs/conll-2003/qwen25-05b/ablations/decoding/full-vocab-trie.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../../grpo/few-shot.yaml

dataset:
  vocab_source: all

grammar:
  mode: vocab

evaluation:
  dual_prompting: false

training:
  output_dir: "experiments/checkpoints/conll-2003/qwen25-05b/ablations/decoding/full-vocab-trie"
  log_dir: "experiments/logs/conll-2003/qwen25-05b/ablations/decoding/full-vocab-trie"

wandb:
  run_name: "conll-2003-qwen25-05b-ablations-decoding-full-vocab-trie"
  tags: ["T2G", "CoNLL-2003", "qwen25-05b", "ablation", "decoding", "full-vocab", "data-leak", "few-shot", "trie"]
