# ============================================================================
# LOSS CELL — GRPO from scratch with the Dr-GRPO objective
#
# One-factor variant of grpo-only.yaml: identical model, data, split, prompting,
# curriculum, reward stack and optimisation budget; ONLY the RL objective
# normalisation changes.
#
# Why this cell exists
# --------------------
# No historical config ever set these knobs, so TRL 0.24.0 defaults applied to
# every stored run: loss_type='dapo', scale_rewards='group',
# mask_truncated_completions=False. That was never a deliberate choice — it was
# an omission, and it means the project has no Dr-GRPO measurement at all even
# though the `edit-rewards` branch switched to it silently (bundled with a
# reward change, a prompting change and a curriculum change, hence
# uninterpretable). This cell isolates the objective.
#
# What changes, precisely (verified against the installed TRL 0.24.0 source):
#   loss_type 'dapo'    -> denominator = total completion tokens in the global
#                          batch (grpo_trainer.py:1739-1741).
#   loss_type 'dr_grpo' -> denominator = B * max_completion_length, a CONSTANT
#                          (grpo_trainer.py:1736-1737). This is the fix from
#                          Dr-GRPO (arXiv:2503.20783 §3.1-3.2), which removes
#                          GRPO's *differential* length bias: dividing by |o_i|
#                          rewards short correct answers and under-penalises
#                          long incorrect ones.
#   scale_rewards 'group' -> advantage divided by its group std.
#   scale_rewards 'none'  -> A = R - mean(R), the unbiased advantage Dr-GRPO
#                            prescribes. NOTE: 'none' does NOT mean "raw
#                            rewards"; TRL always subtracts the group mean
#                            (grpo_trainer.py:1493), only the division is
#                            skipped (:1508-1509).
#   mask_truncated_completions true -> tokens of truncated completions are
#                            excluded from the loss (DAPO's overlong FILTERING
#                            half). The soft overlong PUNISHMENT half is not
#                            implemented in TRL 0.24.0.
#
# Known limitations of this arm, so results are read correctly:
#   - TRL 0.24.0 does NOT implement DAPO's dynamic sampling; it only logs
#     `frac_reward_zero_std`. Zero-variance groups are therefore still wasted
#     compute in both arms, which matters here: measured on zero-shot+Trie
#     rollouts, 21.45% of groups have zero reward variance and 19.90% are fully
#     dead. Changing the denominator cannot fix that.
#   - Clip-higher is a separate knob; set grpo.epsilon_high (e.g. 0.28) to
#     enable it. Left at the symmetric default here to keep one factor.
#
# Uso:
#   CONFIG=experiments/configs/t2g/grpo-drgrpo.yaml sbatch cluster/train.sh
# ============================================================================

extends: grpo-only.yaml

grpo:
  loss_type: dr_grpo
  scale_rewards: none
  mask_truncated_completions: true

training:
  output_dir: "experiments/checkpoints/qwen25-05b-grpo-drgrpo"
  log_dir: "experiments/logs/qwen25-05b-grpo-drgrpo"

wandb:
  name: "qwen25-05b-grpo-drgrpo"
