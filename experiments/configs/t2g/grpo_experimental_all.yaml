# ============================================================================
# EXPERIMENTAL Config — GRPO + ALL Reward Modules + Constrained Decoding
#
# Eredita da base.yaml e attiva TUTTI i moduli di reward disponibili
# (inclusi soft_viterbi, viterbi, structure che nella base sono 0):
#   translation .25, bleu .10, gold_structure .15, gloss_order .10,
#   verifier_scaled .10, soft_viterbi .10, viterbi .05, structure .05,
#   format .05, repetition .05  (somma = 1.0 — verificato dal validator).
#
# ⚠️  SPERIMENTALE — non ottimizzato. I pesi sono distribuiti come baseline
# di partenza per ablation. beta=0.02 / temperature=0.8 (diversi dalla base).
#
# Uso:
#   CONFIG=experiments/configs/t2g/grpo_experimental_all.yaml sbatch cluster/train.sh
#   python -m src.training --config experiments/configs/t2g/grpo_experimental_all.yaml
# ============================================================================

extends: base.yaml

# --- SFT Pre-training (Phase 0) ---
sft_pretrain:
  enabled: true
  training:
    num_train_epochs: 1
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true

# --- Iperparametri di training GRPO (solo differenze dalla base) ---
training:
  max_steps: 2000
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/qwen25-05b-experimental-all"
  log_dir: "experiments/logs/qwen25-05b-experimental-all"

# --- Parametri GRPO ---
grpo:
  beta: 0.02 # KL penalty più basso per più esplorazione
  temperature: 0.8 # più esplorazione nei rollout

# --- Pesi della reward function (ALL MODULES ON, somma = 1.0) ---
reward:
  # ── Translation & structure (core) ────────────────────────────────
  weight_translation: 0.25 # ROUGE-L (primary signal)
  weight_bleu: 0.10 # BLEU-4 (RVLF 2025)
  weight_gold_structure: 0.15 # bigram vs gold baseline
  weight_gloss_order: 0.10 # edit-distance vs gold

  # ── Verifier-scaled (RECIPE-inspired) ─────────────────────────────
  weight_verifier_scaled: 0.10 # structural confidence × ROUGE-L

  # ── Experimental structural modules (normalmente spenti) ──────────
  weight_soft_viterbi: 0.10 # differentiable Viterbi (ViterbiPlanNet DVL)
  weight_viterbi: 0.05 # hard Viterbi distance (non-differentiable)
  weight_structure: 0.05 # absolute bigram score (no baseline)

  # ── Format & regularization ───────────────────────────────────────
  weight_format: 0.05
  weight_repetition: 0.05

# --- Curriculum Learning (disabled) ---
curriculum:
  enabled: false

# --- Evaluation ---
evaluation:
  max_samples: 500
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "grpo-t2g-experimental-all"
  tags:
    [
      "grpo",
      "T2G",
      "experimental",
      "all-modules",
      "soft-viterbi",
      "viterbi",
      "verifier-scaled",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
