# ============================================================================
# ABLATION CELL — TUTTI e 3 i moduli sperimentali (v2 gold-anchored)
#
# Cella "all-three" dell'ablation dei moduli sperimentali sulla pipeline
# SFT+GRPO (sft-grpo = controllo): structural_dense 0.05 + viterbi 0.05
# + soft_viterbi 0.10 = 0.20, core diluito ×0.80 (proporzioni invariate).
# Somma = 1.0 (validator).
#
# RISCRITTA (v2): la versione pre-fix (beta 0.02, temp 0.8, niente
# curriculum, reward v1 saturate a ~-1 con std≈0 → zero segnale GRPO) è
# stata abbandonata dopo il run 7078 (391s/it, ucciso a 12h). Ora eredita
# TUTTO da sft-grpo (beta 0.04, temp 0.7, curriculum ON, retrieval ON,
# SFT riusato via fingerprint cross-tag) e differisce SOLO nei pesi reward
# → cella a fattore unico. La run pre-fix run_20260829_211642 in questo
# stesso tag dir è obsoleta (find_newest_checkpoint usa la run più recente).
#
# NOTA: i tre moduli sono altamente correlati per completions della stessa
# lunghezza (i bound si cancellano → stesso delta) — attesi ~quasi-duplicati
# tra le celle singole; questa cella misura l'effetto COMBINATO.
#
# Uso:
#   CONFIG=experiments/configs/t2g/sft-grpo-all-rewards.yaml sbatch cluster/train.sh
# ============================================================================

extends: sft-grpo.yaml

# --- Directory (tag invariato: coesiste con la run obsoleta pre-fix) ---
training:
  output_dir: "experiments/checkpoints/qwen25-05b-sft-grpo-all-rewards"
  log_dir: "experiments/logs/qwen25-05b-sft-grpo-all-rewards"

# --- Reward: core ×0.80 + tutti i moduli sperimentali 0.20 (somma = 1.0) ---
reward:
  # core di sft-grpo diluito uniformemente (proporzioni invariate)
  weight_translation: 0.16
  weight_bleu: 0.16
  weight_gold_structure: 0.16
  weight_gloss_order: 0.08
  weight_verifier_scaled: 0.08
  weight_format: 0.08
  weight_repetition: 0.08
  # ── moduli sperimentali (v2 gold-anchored) ──
  weight_structure: 0.05 # structural_dense
  weight_viterbi: 0.05 # viterbi_distance
  weight_soft_viterbi: 0.10 # soft_viterbi (DVL-inspired)

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-grpo-all-rewards"
  tags:
    [
      "grpo",
      "T2G",
      "ablation",
      "all-modules",
      "structural-dense",
      "viterbi-distance",
      "soft-viterbi",
      "gold-anchored-v2",
      "curriculum",
      "retrieval",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
