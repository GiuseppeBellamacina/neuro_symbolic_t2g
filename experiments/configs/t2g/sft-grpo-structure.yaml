# ============================================================================
# ABLATION CELL — + structural_dense (1 dei 3 moduli sperimentali, da solo)
#
# Cella dell'ablation dei moduli sperimentali sulla pipeline SFT+GRPO
# (sft-grpo = controllo). Differenza a fattore unico rispetto a
# sft-grpo: 10% della massa reward spostata su structural_dense.
#
# Design dei pesi (diluizione uniforme): i 7 core di optimal sono scalati
# ×0.90 mantenendo le PROPORZIONI RELATIVE identiche (.20→.18, .10→.09) +
# weight_structure: 0.10 → somma 1.0 (validator). Così l'unica differenza
# sostanziale vs optimal è "10% di massa reward al modulo in test".
#
# structural_dense v2 (gold-anchored): plausibilità bigram RELATIVA al gold.
# A τ=1.5 su matrice reale: gold +1.00, 1 errore +0.05, shuffle −0.43,
# token random −0.73. NOTA: a temperature=1 coincide con gold_structure
# (documentato) — τ=1.5 lo rende la variante "soffice/DVL".
#
# Uso:
#   CONFIG=experiments/configs/t2g/sft-grpo-structure.yaml sbatch cluster/train.sh
# ============================================================================

extends: sft-grpo.yaml

# --- Directory dedicate ---
training:
  output_dir: "experiments/checkpoints/qwen25-05b-sft-grpo-structure"
  log_dir: "experiments/logs/qwen25-05b-sft-grpo-structure"

# --- Reward: core ×0.90 + modulo in test 0.10 (somma = 1.0) ---
reward:
  # core di sft-grpo diluito uniformemente (proporzioni invariate)
  weight_translation: 0.18
  weight_bleu: 0.18
  weight_gold_structure: 0.18
  weight_gloss_order: 0.09
  weight_verifier_scaled: 0.09
  weight_format: 0.09
  weight_repetition: 0.09
  # ── modulo sperimentale in test ──
  weight_structure: 0.10

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-grpo-structure"
  tags:
    [
      "grpo",
      "T2G",
      "ablation",
      "sft-grpo-structure", "structural-dense",
      "gold-anchored-v2",
      "curriculum",
      "retrieval",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
