# ============================================================================
# SFT-GRPO PDA — constrained decoding via Pushdown Automaton (grammarllm)
#
# Cella per il confronto Trie-vs-PDA (capitolo constrained decoding della
# tesi): pipeline SFT+GRPO IDENTICA a sft-grpo ma il constrained decoding
# usa il PDA LL(1) di grammarllm (StatelessLogitsProcessor) invece del Trie
# dual-root. Differenza a fattore unico: `use_grammarllm_pda: true`.
#
# Il PDA influenza ANCHE i rollout GRPO (la maschera token-by-token è
# generata dal PDA durante il training, non solo a eval). Per questo la
# cella richiede un train completo (~2h), non solo un eval.
#
# NOTA sul fix PDA (backport upstream 9ba32d2, vedi grammarllm/
# VENDORED_STATUS.md): senza il fix `pad_token == eos_token` ogni metrica
# `pda_stack` sarebbe falsata (stack non vuota su ogni generazione valida).
# Il fix è già backportato nel vendored.
#
# Uso:
#   CONFIG=experiments/configs/t2g/sft-grpo-pda.yaml sbatch cluster/train.sh
#   bash cluster/run_all.sh sft-grpo-pda            # via coda chain
# ============================================================================

extends: sft-grpo.yaml

# --- Unica differenza: constrained decoding via PDA grammarllm ---
grammar:
  use_grammarllm: true
  use_grammarllm_pda: true
  pda_temperature: 1.0 # temperatura PDA (= default upstream, dichiarata per il validator)

# --- Directory dedicate ---
training:
  output_dir: "experiments/checkpoints/qwen25-05b-sft-grpo-pda"
  log_dir: "experiments/logs/qwen25-05b-sft-grpo-pda"

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-grpo-pda"
  tags:
    [
      "sft-grpo-pda",
      "pda",
      "grammarllm",
      "constrained-decoding",
      "trie-vs-pda",
      "curriculum",
      "retrieval",
      "Qwen2.5-0.5B",
      "ASL",
    ]
