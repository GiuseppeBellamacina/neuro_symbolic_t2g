# ============================================================================
# ABLATION CELL — + viterbi_distance (1 dei 3 moduli sperimentali, da solo)
#
# Cella dell'ablation dei moduli sperimentali sulla pipeline SFT+GRPO
# (sft-grpo = controllo). Differenza a fattore unico: 10% della massa
# reward spostata su viterbi_distance (pesi core diluiti ×0.90, proporzioni
# invariate — vedi sft-grpo-structure.yaml per il rationale).
#
# viterbi_distance v2 (gold-anchored): quanto il completamento sfrutta il
# headroom verso il bound Viterbi-diverso, RELATIVAMENTE a quanto lo
# sfrutta il gold. Bound cachato per lunghezza (decode ~una volta per run).
#
# Uso:
#   CONFIG=experiments/configs/t2g/sft-grpo-viterbi.yaml sbatch cluster/train.sh
# ============================================================================

extends: sft-grpo.yaml

# --- Directory dedicate ---
training:
  output_dir: "experiments/checkpoints/qwen25-05b-sft-grpo-viterbi"
  log_dir: "experiments/logs/qwen25-05b-sft-grpo-viterbi"

# --- Reward: core ×0.90 + modulo in test 0.10 (somma = 1.0) ---
reward:
  weight_translation: 0.18
  weight_bleu: 0.18
  weight_gold_structure: 0.18
  weight_gloss_order: 0.09
  weight_verifier_scaled: 0.09
  weight_format: 0.09
  weight_repetition: 0.09
  # ── modulo sperimentale in test ──
  weight_viterbi: 0.10

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-grpo-viterbi"
  tags:
    [
      "grpo",
      "T2G",
      "ablation",
      "sft-grpo-viterbi", "viterbi-distance",
      "gold-anchored-v2",
      "curriculum",
      "retrieval",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
