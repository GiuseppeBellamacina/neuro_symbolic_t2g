# ============================================================================
# SFT-ONLY — Supervised Fine-Tuning da solo (cella di decomposizione)
#
# Baseline supervised per la tabella Base / SFT-only / GRPO-only / SFT+GRPO:
# teacher forcing sulle gloss di riferimento, senza reward shaping né RL.
#
# NB: per la TABELLA di decomposizione NON serve rilanciare questo config —
# l'adapter SFT della pipeline (identica sezione sft_pretrain di sft-grpo)
# è già addestrato e va valutato direttamente:
#   CHECKPOINT=experiments/checkpoints/qwen25-05b-sft-grpo/run_*/sft_pretrain/final \
#     CONFIG=experiments/configs/t2g/sft-grpo.yaml sbatch cluster/eval.sh
# Questo config serve solo per un RE-TRAIN standalone di SFT.
#
# Eredita da base.yaml; sovrascrive `training` (trainer: sft, epoche, eval
# holdout + early stopping, max_seq_length 768). Le chiavi reward non sono
# usate in training (solo in eval). Eval allineata al protocollo delle
# celle GRPO (num_samples=5, temp 0.7) per confrontabilità diretta.
#
# Usato da:
#   CONFIG=experiments/configs/t2g/sft-only.yaml sbatch cluster/train.sh
#   python -m src.training --config experiments/configs/t2g/sft-only.yaml
# ============================================================================

extends: base.yaml

# --- LoRA adattatori (leggeri, come il config GRPO base) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Iperparametri di training SFT (sovrascrive completamente la base) ---
training:
  trainer: sft # Auto-detection key for __main__.py bootstrap
  # SFT usa epoche invece di max_steps (supervised, non RL). 3 epoche sono
  # ora sicure: un eval holdout + early stopping fermano il training se
  # eval_loss smette di migliorare (anti-overfitting sui ~78K sample).
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  optim: "paged_adamw_8bit"
  weight_decay: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true # OOM mitigation
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2 # meno checkpoint: load_best_model_at_end conserva il best
  max_seq_length: 768
  # --- Held-out eval + early stopping (anti-overfitting) ---
  # Viene ricavato dal TRAIN split un eval set (eval_fraction, seed =
  # dataset.seed). Il training monitora eval_loss: si ferma dopo
  # early_stopping_patience valutazioni senza miglioramenti e a fine run
  # viene ricaricato/salvato il checkpoint con eval_loss migliore.
  eval_fraction: 0.02 # 2% del train (~1.6K campioni su ~78K)
  eval_steps: 200 # valutazione ogni 200 update steps
  early_stopping_patience: 3
  output_dir: "experiments/checkpoints/qwen25-05b-sft-only"
  log_dir: "experiments/logs/qwen25-05b-sft-only"

# --- Parametri di generazione (eval-only: usati da eval_t2g.py) ---
generation:
  max_completion_length: 256
  max_prompt_length: 256
  temperature: 0.7

# --- Pesi della reward function (eval-only per SFT) ---
# Le chiavi della base non usate qui (weight_bleu, weight_verifier_scaled)
# vengono azzerate esplicitamente così il dict fuso mantiene somma = 1.0.
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato da questo config
  weight_gold_structure: 0.35
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato da questo config
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation (stesso protocollo delle celle GRPO: confrontabile) ---
evaluation:
  max_samples: null # eval job = INTERO test set (override: eval.sh MAX_SAMPLES)
  num_samples: 5 # 5 completion per prompt — identico alle celle GRPO
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-only"
  tags: ["sft-only", "decomposition", "SFT", "supervised", "T2G", "Qwen2.5-0.5B", "ASL"]
