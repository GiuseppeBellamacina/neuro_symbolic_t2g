# ============================================================================
# SFT Training Config — Qwen2.5-0.5B-Instruct — Text-to-Gloss (T2G)
#
# Supervised Fine-Tuning baseline per confronto con GRPO nell'ablation study.
# L'SFT addestra il modello via teacher forcing sulle gloss di riferimento,
# senza reward shaping né constrained decoding durante il training.
#
# Eredita da base.yaml, ma sovrascrive `training` con i parametri SFT
# (trainer: sft, epoche, eval holdout + early stopping, max_seq_length 768).
# Le chiavi reward non sono usate in training (solo in eval).
#
# Usato da:
#   CONFIG=experiments/configs/t2g/sft.yaml sbatch cluster/train.sh
#   python -m src.training.sft_train --config experiments/configs/t2g/sft.yaml
# ============================================================================

extends: base.yaml

# --- LoRA adattatori (leggeri, come il config GRPO base) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Iperparametri di training SFT (sovrascrive completamente la base) ---
training:
  trainer: sft # Auto-detection key for __main__.py bootstrap
  # SFT usa epoche invece di max_steps (supervised, non RL). 3 epoche sono
  # ora sicure: un eval holdout + early stopping fermano il training se
  # eval_loss smette di migliorare (anti-overfitting sui ~78K sample).
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  optim: "paged_adamw_8bit"
  weight_decay: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true # OOM mitigation
  logging_steps: 10
  save_steps: 200
  save_total_limit: 2 # meno checkpoint: load_best_model_at_end conserva il best
  max_seq_length: 768
  # --- Held-out eval + early stopping (anti-overfitting) ---
  # Viene ricavato dal TRAIN split un eval set (eval_fraction, seed =
  # dataset.seed). Il training monitora eval_loss: si ferma dopo
  # early_stopping_patience valutazioni senza miglioramenti e a fine run
  # viene ricaricato/salvato il checkpoint con eval_loss migliore.
  eval_fraction: 0.02 # 2% del train (~1.6K campioni su ~78K)
  eval_steps: 200 # valutazione ogni 200 update steps
  early_stopping_patience: 3
  output_dir: "experiments/checkpoints/qwen25-05b-sft"
  log_dir: "experiments/logs/qwen25-05b-sft"

# --- Parametri di generazione (eval-only: usati da eval_t2g.py) ---
generation:
  max_completion_length: 256
  max_prompt_length: 256
  temperature: 0.7

# --- Pesi della reward function (eval-only per SFT) ---
# Le chiavi della base non usate qui (weight_bleu, weight_verifier_scaled)
# vengono azzerate esplicitamente così il dict fuso mantiene somma = 1.0.
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato da questo config
  weight_gold_structure: 0.35
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato da questo config
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500 # 500 campioni per evaluation rapida, null per tutto il test set
  num_samples: 1 # SFT usa greedy (1 completion per prompt)
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "ablation-sft-baseline"
  tags: ["ablation", "SFT", "supervised", "T2G", "Qwen2.5-0.5B", "ASL"]
