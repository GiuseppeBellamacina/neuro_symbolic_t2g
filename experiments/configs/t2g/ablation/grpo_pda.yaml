# ============================================================================
# Ablation Study — GRPO + GrammarLLM PDA (Full LL(1) Constrained Decoding)
#
# Esegue training GRPO CON constrained decoding via Pushdown Automaton
# (grammarllm) invece del Trie dual-root. Eredita da base.yaml; differenze:
# PDA on + pda_temperature=1.0, LoRA r=16, 1500 step, lr=5e-6, G=4,
# max_completion 256, reward storica senza BLEU/verifier-scaled.
#
# Usato da:
#   CONFIG=experiments/configs/t2g/ablation/grpo_pda.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

# --- LoRA adattatori (leggeri) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Constrained Decoding (PDA mode) ---
grammar:
  use_grammarllm_pda: true # Ablation: full LL(1) grammar via Pushdown Automaton
  pda_temperature: 1.0 # Temperature for PDA logit scaling

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 1500
  learning_rate: 5.0e-6
  warmup_steps: 150 # was warmup_ratio: 0.1 → deprecated in transformers 5.2+
  output_dir: "experiments/checkpoints/qwen25-05b-pda"
  log_dir: "experiments/logs/qwen25-05b-pda"

# --- Parametri GRPO ---
grpo:
  num_generations: 4
  max_completion_length: 256 # con PDA, generazione più lunga

# --- Pesi della reward function (set storico, chiavi base azzerate) ---
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato
  weight_gold_structure: 0.35
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "ablation-grpo-pda"
  tags:
    [
      "ablation",
      "GRPO",
      "grammarllm",
      "PDA",
      "LL1",
      "T2G",
      "Qwen2.5-0.5B",
      "ASL",
    ]
