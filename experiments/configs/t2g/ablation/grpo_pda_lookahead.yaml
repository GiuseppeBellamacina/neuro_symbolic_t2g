# ============================================================================
# Ablation Config — GRPO + Full PDA + Token-Boundary Lookahead
#
# Sfrutta le capacità di grammarllm v0.5.0: PDA completo LL(1) + emissione
# di token BPE nativi che attraversano i boundary grammaticali. Allineato a
# grpo_optimal per tutto il resto (curriculum on, reward v2.1 dalla base).
#
# ⭐ KEY DIFFERENCE dalla base: grammar.use_grammarllm_pda: true,
# grammar.token_lookahead: true, curriculum.enabled: true.
#
# Uso:
#   CONFIG=experiments/configs/t2g/ablation/grpo_pda_lookahead.yaml sbatch cluster/run_all.sh
#   python -m src.training --config experiments/configs/t2g/ablation/grpo_pda_lookahead.yaml
# ============================================================================

extends: ../base.yaml

# --- SFT Pre-training (Phase 0) ---
sft_pretrain:
  enabled: true
  training:
    num_train_epochs: 1
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 2000
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/qwen25-05b-pda-lookahead"
  log_dir: "experiments/logs/qwen25-05b-pda-lookahead"

# --- Constrained Decoding ---
# ⭐ KEY DIFFERENCE: PDA completo + token-boundary lookahead (grammarllm v0.5.0)
grammar:
  use_grammarllm_pda: true   # ← era false (Trie dual-root) nella base
  token_lookahead: true       # ← NUOVO: native BPE token emission
  pda_temperature: 1.0 # default esplicito (usato da eval_t2g.py)

# --- Curriculum Learning (ATTIVO, come grpo_optimal) ---
curriculum:
  enabled: true

# --- Evaluation ---
evaluation:
  max_samples: 500

# --- Weights & Biases ---
wandb:
  run_name: "ablation-grpo-pda-lookahead"
  tags:
    [
      "ablation",
      "grpo",
      "pda",
      "lookahead",
      "token-boundary",
      "grammarllm-v050",
      "T2G",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
