# ============================================================================
# Ablation Config — GRPO without SFT Pre-training
#
# Tests GRPO training directly on the base model (Qwen2.5-0.5B-Instruct)
# without the Phase 0 SFT pre-training step. Eredita da base.yaml; beta=0.02
# e temperature=0.8 restano espliciti (diversi dalla base).
# ============================================================================

extends: ../base.yaml

# --- SFT Pre-training DISABLED for Ablation ---
sft_pretrain:
  enabled: false

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 2000
  learning_rate: 3.0e-6
  warmup_steps: 200
  output_dir: "experiments/checkpoints/qwen25-05b-no-sft"
  log_dir: "experiments/logs/qwen25-05b-no-sft"

# --- Parametri GRPO ---
grpo:
  beta: 0.02 # esplicito: diverso dalla base (0.04)
  temperature: 0.8 # esplicito: diverso dalla base (0.7)

# --- Pesi della reward function (set con verifier-scaled, bleu azzerato) ---
reward:
  weight_translation: 0.25
  weight_bleu: 0.0 # non usato
  weight_gold_structure: 0.25
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.15
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500

# --- Weights & Biases ---
wandb:
  run_name: "ablation-grpo-no-sft"
  tags:
    [
      "ablation",
      "grpo",
      "no-sft",
      "T2G",
      "constrained-decoding",
      "Qwen2.5-0.5B",
      "ASL",
    ]
