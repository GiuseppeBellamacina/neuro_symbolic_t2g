# ============================================================================
# Ablation Study — GRPO with Soft Viterbi Reward (Differentiable Viterbi)
#
# Tests la reward soft Viterbi (forward-backward, ViterbiPlanNet DVL) al
# posto di gold_structure. Eredita da base.yaml; differenze: LoRA r=16,
# max_samples=20000, 1500 step, lr=5e-6, G=4, reward con soft_viterbi .35
# (gold_structure/bleu/verifier_scaled azzerati).
#
# Usato da:
#   CONFIG=experiments/configs/t2g/ablation/grpo_soft_viterbi.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

# --- LoRA adattatori (leggeri) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Dataset (sottoinsieme) ---
dataset:
  max_samples: 20000

# --- SFT Pre-training ---
sft_pretrain:
  enabled: true
  training:
    num_train_epochs: 1
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 1500
  learning_rate: 5.0e-6
  warmup_steps: 150
  output_dir: "experiments/checkpoints/qwen25-05b-soft-viterbi"
  log_dir: "experiments/logs/qwen25-05b-soft-viterbi"

# --- Parametri GRPO ---
grpo:
  num_generations: 4

# --- Pesi della reward function ---
# Ablation: replace gold_structure with soft_viterbi (ViterbiPlanNet DVL).
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato
  weight_gold_structure: 0.0 # sostituita da soft_viterbi
  weight_soft_viterbi: 0.35 # ← Differentiable Viterbi (forward-backward)
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "grpo-t2g-soft-viterbi"
  tags: ["grpo", "T2G", "ablation", "soft-viterbi", "ViterbiPlanNet"]
