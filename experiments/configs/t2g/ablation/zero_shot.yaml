# ============================================================================
# Ablation Study — Base Model Zero-Shot (No Grammar, No Training)
#
# Esegue solo evaluation sul modello base Qwen2.5-0.5B-Instruct senza
# constrained decoding e senza alcun training. Eredita da base.yaml (model,
# dataset, grpo, grammar, wandb) e disattiva il grammar.
#
# Usato da:
#   python -m src.training.eval_t2g --config experiments/configs/t2g/ablation/zero_shot.yaml
# ============================================================================

extends: ../base.yaml

# --- Parametri di generazione (eval-only) ---
grpo:
  max_completion_length: 256
  max_prompt_length: 256
  temperature: 0.7

# --- Grammar DISABLED (generazione libera) ---
grammar:
  enabled: false

# --- Reward: solo ROUGE-L (chiavi base azzerate, somma = 1.0) ---
reward:
  weight_translation: 1.0
  weight_bleu: 0.0
  weight_gold_structure: 0.0
  weight_gloss_order: 0.0
  weight_verifier_scaled: 0.0
  weight_format: 0.0
  weight_repetition: 0.0

# --- Evaluation ---
evaluation:
  max_samples: 500
  num_samples: 1 # zero-shot usa greedy
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "ablation-zero-shot"
  tags: ["ablation", "zero-shot", "no-grammar", "T2G", "ASL"]
