# ============================================================================
# Ablation Study — GRPO with Verifier-Scaled Reward (RECIPE-inspired)
#
# Tests la reward verifier-scaled (RECIPE, arXiv:2605.19976): plausibilità
# strutturale come confidence multiplier della qualità di traduzione.
# Eredita da base.yaml; differenze: LoRA r=16, max_samples=20000, 1500 step,
# lr=5e-6, G=4, reward con verifier_scaled .65 (translation/bleu/
# gold_structure azzerati).
#
# Usato da:
#   CONFIG=experiments/configs/t2g/ablation/grpo_verifier_scaled.yaml sbatch cluster/train.sh
# ============================================================================

extends: ../base.yaml

# --- LoRA adattatori (leggeri) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Dataset (sottoinsieme) ---
dataset:
  max_samples: 20000

# --- SFT Pre-training ---
sft_pretrain:
  enabled: true
  training:
    num_train_epochs: 1
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 1500
  learning_rate: 5.0e-6
  warmup_steps: 150
  output_dir: "experiments/checkpoints/qwen25-05b-verifier-scaled"
  log_dir: "experiments/logs/qwen25-05b-verifier-scaled"

# --- Parametri GRPO ---
grpo:
  num_generations: 4

# --- Pesi della reward function ---
# Ablation: replace translation + gold_structure with verifier_scaled (RECIPE).
reward:
  weight_translation: 0.0 # sostituita da verifier_scaled
  weight_bleu: 0.0 # non usato
  weight_gold_structure: 0.0 # sostituita da verifier_scaled
  weight_verifier_scaled: 0.65 # ← RECIPE verifier-scaled
  weight_gloss_order: 0.15
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "grpo-t2g-verifier-scaled"
  tags: ["grpo", "T2G", "ablation", "verifier-scaled", "RECIPE"]
