# ============================================================================
# Ablation Study — GRPO WITHOUT Grammar (GRPO No Grammar)
#
# Esegue training GRPO standard SENZA constrained decoding (nessun vocabulary
# mask). Le reward sono le stesse del training standard. Eredita da base.yaml;
# differenze: grammar off, LoRA r=16, 1500 step, lr=5e-6, G=4, max_completion
# 256, reward storica senza BLEU/verifier-scaled.
#
# Usato da:
#   CONFIG=experiments/configs/t2g/ablation/grpo_no_grammar.yaml sbatch cluster/train.sh
#   python -m src.training --config experiments/configs/t2g/ablation/grpo_no_grammar.yaml
# ============================================================================

extends: ../base.yaml

# --- LoRA adattatori (leggeri) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Grammar DISABLED for ablation ---
grammar:
  enabled: false

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 1500
  learning_rate: 5.0e-6
  warmup_steps: 150 # was warmup_ratio: 0.1 → deprecated in transformers 5.2+
  output_dir: "experiments/checkpoints/qwen25-05b-no-grammar"
  log_dir: "experiments/logs/qwen25-05b-no-grammar"

# --- Parametri GRPO ---
grpo:
  num_generations: 4
  max_completion_length: 256 # senza grammar il modello può generare free text

# --- Pesi della reward function (set storico, chiavi base azzerate) ---
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato
  weight_gold_structure: 0.35
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato
  weight_format: 0.10
  weight_repetition: 0.10

# --- Evaluation ---
evaluation:
  max_samples: 500
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "ablation-grpo-no-grammar"
  tags: ["ablation", "GRPO", "no-grammar", "T2G", "Qwen2.5-0.5B", "ASL"]
