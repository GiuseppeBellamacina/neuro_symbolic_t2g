# ============================================================================
# Ablation Study — Base Model + GRAMMAR-LLM (Zero-Shot with Grammar)
#
# Esegue solo evaluation sul modello base Qwen2.5-0.5B-Instruct CON
# constrained decoding (vocabulary mask) ma SENZA training. Eredita da
# base.yaml; unica differenza da zero_shot.yaml: grammar.enabled: true.
#
# Usato da:
#   python -m src.training.eval_t2g --config experiments/configs/t2g/ablation/zero_shot_grammar.yaml
# ============================================================================

extends: ../base.yaml

# --- Parametri di generazione (eval-only) ---
grpo:
  max_completion_length: 256
  max_prompt_length: 256
  temperature: 0.7

# --- Grammar ENABLED (Trie dual-root dalla base) ---
grammar:
  enabled: true

# --- Reward: solo ROUGE-L (chiavi base azzerate, somma = 1.0) ---
reward:
  weight_translation: 1.0
  weight_bleu: 0.0
  weight_gold_structure: 0.0
  weight_gloss_order: 0.0
  weight_verifier_scaled: 0.0
  weight_format: 0.0
  weight_repetition: 0.0

# --- Evaluation ---
evaluation:
  max_samples: 500
  num_samples: 1 # zero-shot usa greedy
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "ablation-zero-shot-grammar"
  tags:
    ["ablation", "zero-shot", "grammar", "constrained-decoding", "T2G", "ASL"]
