# ============================================================================
# GRPO Training Config — Qwen2.5-0.5B-Instruct — Text-to-Gloss (T2G)
#
# Config "base" di riferimento per GRPO (quello che converge):
#   - Eredita da base.yaml (modello, dataset, grammar Trie, SFT, wandb)
#   - LoRA più leggero: r=16 / alpha=32 / dropout=0
#   - 1500 step, lr=5e-6, warmup=150, G=4, max_samples=20000
#   - beta=0.04 / temperature=0.7 / max_grad_norm=0.1 (già nella base)
#   - reward: set storico senza BLEU/verifier-scaled (chiavi base azzerate)
#
# Usato da:
#   CONFIG=experiments/configs/t2g/grpo_qwen05.yaml sbatch cluster/train.sh
#   python -m src.training --config experiments/configs/t2g/grpo_qwen05.yaml
# ============================================================================

extends: base.yaml

# --- LoRA adattatori (più leggeri della base r=32) ---
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0

# --- Dataset (sottoinsieme per iterazione veloce) ---
dataset:
  max_samples: 20000

# --- SFT Pre-training (Phase 0: teach model gloss format before GRPO) ---
sft_pretrain:
  enabled: true
  training:
    num_train_epochs: 1 # 1 epoch is enough to learn the format
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true

# --- Iperparametri di training (solo differenze dalla base) ---
training:
  max_steps: 1500
  learning_rate: 5.0e-6
  warmup_steps: 150 # was warmup_ratio: 0.1 → deprecated in transformers 5.2+
  output_dir: "experiments/checkpoints/qwen25-05b"
  log_dir: "experiments/logs/qwen25-05b"

# --- Parametri GRPO ---
grpo:
  num_generations: 4 # G = number of completions per prompt

# --- Pesi della reward function (set storico di questo config) ---
# Le chiavi della base non usate qui (weight_bleu, weight_verifier_scaled)
# vengono azzerate esplicitamente così il dict fuso mantiene somma = 1.0.
reward:
  weight_translation: 0.30
  weight_bleu: 0.0 # non usato da questo config
  weight_gold_structure: 0.35
  weight_gloss_order: 0.15
  weight_verifier_scaled: 0.0 # non usato da questo config
  weight_format: 0.10
  weight_repetition: 0.10

# --- Curriculum Learning (disabled for Phase 1) ---
curriculum:
  enabled: false

# --- Evaluation ---
evaluation:
  max_samples: 500 # 500 campioni per evaluation rapida, null per tutto il test set
  best_of_n: false

# --- Weights & Biases ---
wandb:
  run_name: "grpo-t2g-qwen25-05b"
  tags: ["grpo", "T2G", "constrained-decoding", "Qwen2.5-0.5B", "ASL"]
