# ============================================================================
# DECOMPOSITION CELL — GRPO from scratch (NO SFT pre-training)
#
# Cella della tabella di decomposizione Base / SFT-only / GRPO-only / SFT+GRPO:
# isolando il contributo del pre-training SFT dentro la pipeline completa.
# Tutto il resto è IDENTICO a sft-grpo (curriculum, retrieval few-shot,
# reward core, iperparametri, 2000 step) → differenza a fattore unico.
#
# NB: senza SFT il modello parte dal base zero-shot: le prime decine di step
# producono gloss scadenti (il formato lo insegna la reward format/repetition
# + il constrained decoding Trie). Convergenza più lenta è IL RISULTATO
# atteso della cella — non un bug.
#
# Uso:
#   CONFIG=experiments/configs/t2g/grpo-only.yaml sbatch cluster/train.sh
#   (la catena auto-accoda l'eval: TUI → BatchStart → "accoda anche eval")
# ============================================================================

extends: sft-grpo.yaml

# --- Disattiva SOLO la Phase 0 (SFT pre-training) ---
sft_pretrain:
  enabled: false # GRPO parte dal base model + LoRA fresca

# --- Directory dedicate (tag separato: run e risultati indipendenti) ---
training:
  output_dir: "experiments/checkpoints/qwen25-05b-grpo-only"
  log_dir: "experiments/logs/qwen25-05b-grpo-only"

# --- Weights & Biases ---
wandb:
  run_name: "t2g-grpo-only"
  tags:
    [
      "grpo",
      "T2G",
      "decomposition",
      "grpo-only",
      "constrained-decoding",
      "curriculum",
      "retrieval",
      "Qwen2.5-0.5B",
      "ASL",
    ]
