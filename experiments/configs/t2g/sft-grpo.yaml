# ============================================================================
# OPTIMAL v2.1 Config — GRPO + Curriculum + Paper-Inspired Rewards
#
# Eredita da base.yaml: modello Qwen2.5-0.5B 4bit + LoRA r=32 + reward v2.1
# ([-1,1] + BLEU-4) + constrained decoding Trie dual-root.
#
# Differenze dalla base:
#   - max_steps=2000, lr=3e-6, warmup=200
#   - Curriculum learning 3-stage (project-original) ATTIVO
#   - beta/temperature/max_grad_norm: ereditati da base (0.04 / 0.7 / 0.1) —
#     riallineati al reference GRPO convergente (vedi header di base.yaml).
#
# Pipeline: SFT pre-training (1 epoch) → GRPO (2000 step, curriculum) → eval.
# ============================================================================

extends: base.yaml

# --- SFT Pre-training (Phase 0) ---
# SFT insegna al modello il formato gloss prima del GRPO.
# RIUSO ADAPTER: se una run precedente dello stesso modello ha già salvato
# un adapter SFT (run_*/sft_pretrain/final) addestrato con la STESSA
# configurazione — fingerprint sha256 di modello/lora/dataset/system prompt/
# iperparametri SFT — il job lo riusa e salta il retrain. Il fingerprint
# invalida se cambia QUALSIASI iperparametro SFT, il modello, il dataset o
# il system prompt. Default: reuse_adapter=true. `--force-sft` (o
# EXTRA_ARGS="--force-sft" sul cluster) forza il retrain in ogni caso.
sft_pretrain:
  enabled: true
  reuse_adapter: true
  # Ricetta ALLINEATA a sft-only (3 epoche + holdout 2% + early stopping):
  # il run 20260901 ha mostrato che 1 epoca è insufficiente — sft-only (3ep)
  # raggiunge ROUGE-L 0.978 mentre GRPO partito dal 1-epoca sottoperformava
  # persino grpo-only. run_sft legge queste chiavi anche dal flusso pipeline
  # (grpo_t2g_train le fonde in training): eval_fraction/eval_steps/
  # early_stopping_patience attivano holdout + load_best_model_at_end.
  # NOTA: cambiare la ricetta cambia la fingerprint SFT → nuovo addestramento
  # (una volta sola, poi riusato cross-tag da tutte le celle di ablation).
  training:
    num_train_epochs: 3 # era 1: allineato alla cella sft-only
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-5
    lr_scheduler_type: "cosine"
    warmup_steps: 50
    optim: "paged_adamw_8bit"
    weight_decay: 0.1
    max_grad_norm: 1.0
    bf16: true
    logging_steps: 10
    save_steps: 200
    save_total_limit: 1
    max_seq_length: 768
    gradient_checkpointing: true
    # --- Holdout + early stopping (anti-overfitting, = sft-only) ---
    per_device_eval_batch_size: 8
    eval_fraction: 0.02 # 2% del train come holdout
    eval_steps: 200
    early_stopping_patience: 3

# --- Iperparametri di training GRPO (solo le differenze dalla base) ---
training:
  max_steps: 2000 # più lungo del default 1500 per migliore convergenza
  learning_rate: 3.0e-6 # stabile con LoRA r=32
  warmup_steps: 200 # warmup più lungo per stabilità
  output_dir: "experiments/checkpoints/qwen25-05b-sft-grpo"
  log_dir: "experiments/logs/qwen25-05b-sft-grpo"

# --- Few-shot retrieval (attivo) ---
# Il few-shot aiuta il modello piccolo (0.5B) a capire il formato del task
# dalle dimostrazioni: esempi simili recuperati dal TRAIN split con
# anti-leakage (mai la query stessa né near-duplicati). Eval usa la STESSA
# strategia per coerenza train/inference. SFT resta zero-shot.
retrieval:
  enabled: true

# --- GRPO overrides ---
# max_prompt_length alzato per il few-shot: 3 esempi (~40-60 token l'uno)
# + query superano i 256 di default; 768 + max_completion 128 <= 1024.
grpo:
  max_prompt_length: 768

# --- Curriculum Learning (project-original, 3-stage) ---
# 3-stage progressive difficulty: il modello inizia con esempi facili e
# gradualmente affronta quelli più difficili. Essenziale per SLM.
curriculum:
  enabled: true

# --- Evaluation: eredita da base (max_samples=2000, num_samples=5) ---

# --- Weights & Biases ---
wandb:
  run_name: "t2g-sft-grpo"
  tags:
    [
      "grpo",
      "T2G",
      "constrained-decoding",
      "sft-grpo",
      "curriculum",
      "bleu-reward",
      "symmetric-reward",
      "G8",
      "grad-ckpt",
      "Qwen2.5-0.5B",
      "ASL",
    ]
