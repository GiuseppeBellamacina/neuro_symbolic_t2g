[project]
name = "neuro_symbolic_t2g"
version = "0.1.0"
description = "Neuro-symbolic pipeline: Constrained Decoding + GRPO for Text-to-Gloss translation"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Neuro-Symbolic T2G Team" },
]

dependencies = [
    # Core ML
    "torch",
    "transformers",
    "trl==0.24.0",
    "peft",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "unsloth>=2026.7.1",
    "unsloth_zoo>=2026.7.1",

    # Data & Eval
    "rouge-score>=0.1.2",
    "sacrebleu>=2.0.0",
    "numpy",
    "pandas",
    "matplotlib",
    "plotnine>=0.14.0",

    # Retrieval (tfidf backend — default in grpo_optimal)
    "scikit-learn>=1.7.2",

    # Infra
    "pyyaml",
    "tqdm",
    "wandb",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "isort",
    "black[jupyter]",
    "ruff",
    "pytest",
]
# Heavy extras for the optional "minilm" retrieval backend only.
# The default "tfidf" backend (scikit-learn) is a core dependency.
retrieval = [
    "sentence-transformers>=5.7.0",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["grammarllm*", "src*", "neuro_symbolic_t2g*"]

[tool.setuptools.package-dir]
"" = "."

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]
