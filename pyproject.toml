[project]
name = "neuro_symbolic_t2g"
version = "0.1.0"
description = "Neuro-symbolic pipeline: Constrained Decoding + GRPO for Text-to-Gloss translation"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Neuro-Symbolic T2G Team" },
]

dependencies = [
    # Core ML
    # ⚠️ STACK ALLINEATO AL CONTAINER DEL CLUSTER (torch 2.7.1+cu118, driver
    # CUDA 12.4, transformers 5.3.0, trl 0.24.0 preinstallati). I pin evitano
    # che pip risolva stack più recenti in ~/.local che hanno la precedenza
    # sul container e rompono CUDA (es. unsloth 2026.8 → torchao 0.18 →
    # richiede torch>=2.11 → "cannot import ScalingType" / "no accelerator").
    # - unsloth 2026.7.1: dichiara torch<2.11 — ultima testata su torch 2.7
    # - torchao >=0.16,<0.18: 0.17 è lo stack del run di luglio 2026 (VERIFICATO
    #   funzionante su torch 2.7.1+cu118). NOTA: torchao NON dichiara torch nei
    #   metadati PyPI — 0.18+ richiede torch>=2.11 (crash "ScalingType"), mentre
    #   <0.16 viene RIFIUTATO dal dispatcher torchao di peft 0.19.1. La finestra
    #   valida è esattamente 0.16–0.17.
    # - peft 0.19.1: versione verificata con transformers 5.3.0 (stesso stack
    #   del run di luglio 2026 e del reference grpo-strict-generation)
    "torch",
    "transformers==5.3.0",
    "trl==0.24.0",
    "peft==0.19.1",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "unsloth==2026.7.1",
    "unsloth_zoo==2026.7.1",
    "torchao>=0.16.0,<0.18",

    # Data & Eval
    "rouge-score>=0.1.2",
    "sacrebleu==2.6.0",
    "numpy",
    "pandas",
    "matplotlib",
    "plotnine>=0.14.0",

    # Retrieval (tfidf backend — default in grpo_optimal)
    "scikit-learn>=1.7.2",

    # Infra
    "pyyaml",
    "tqdm",
    "wandb",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "isort",
    "black[jupyter]",
    "ruff",
    "pytest",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "httpx>=0.28.1",
]
# Heavy extras for the optional "minilm" retrieval backend only.
# The default "tfidf" backend (scikit-learn) is a core dependency.
retrieval = [
    "sentence-transformers>=5.7.0",
]
# Local TUI client for the remote cluster driver (remote/tui.py). Self-contained:
# textual + httpx are declared here so the extra works without pulling "dev".
tui = [
    "textual>=0.85",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["grammarllm*", "src*", "neuro_symbolic_t2g*"]

[tool.setuptools.package-dir]
"" = "."

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
